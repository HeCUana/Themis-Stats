# Themis Stats (忒弥斯统计) - build properties
#
# Versions locked against the sources verified on 2026-10-20:
#   Minecraft 1.21.11 / Fabric Loader 0.18.2 / Fabric API 0.141.6+1.21.11
#   Carpet 1.4.194 (known source baseline, see docs/VERSIONS.md)
#   Loom 1.13.6 / Gradle 9.1.0 / Mojang official mappings
#
# NOTE: this project deliberately uses Mojang official mappings (loom.officialMojangMappings())
# because Carpet 1.4.194 itself is built with them. Keeping the same namespace guarantees
# that the Carpet API surface (carpet.patches.EntityPlayerMPFake, carpet.helpers.EntityPlayerActionPack,
# carpet.api.settings.*) resolves to the exact same members we verified against the 1.4.194 sources.

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric / Minecraft
minecraft_version=1.21.11
loader_version=0.18.2
fabric_version=0.141.6+1.21.11
carpet_version=1.4.194
sqlite_jdbc_version=3.53.4.0

# Mod
mod_version=0.1.0
maven_group=dev.themisstats
archives_base_name=themis-stats
