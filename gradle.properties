# Themis Stats (忒弥斯统计) - build properties
#
# Minecraft 26.3 branch. Versions locked against what was actually resolved on 2026-10-21:
#   Minecraft 26.3 (正式版) / Fabric Loader 0.19.5 / Fabric API 0.164.0+26.3
#   Carpet 26.3 (Modrinth maven, 官方 v26.3 制品) / Loom 1.17.21 / Gradle 9.5.1
#   Zulu JDK 25.0.4.1 (Java 25, MC 26.3 的最低要求)
#
# 重要：Minecraft 26.1 起**不再混淆**，因此
#   * 映射由游戏本体提供，不再需要 mappings（旧的 loom.officialMojangMappings() 已删除）；
#   * 插件换成不重映射的新版 net.fabricmc.fabric-loom；
#   * modImplementation / modCompileOnly 换成普通的 implementation / compileOnly；
#   * remapJar 换成 jar。
# 上游依据见 docs/upgrade/26.3/dependencies.md。
#
# 版本号带 mc 段，产物名能直接看出它针对哪个 MC：
#   themis-stats-0.2.0+mc26.3.jar

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# 本地工具链：Zulu JDK 25（.toolchains/zulu25），相对工程目录。
# Gradle 用它来满足 java.toolchain=25 的编译与测试 JVM。
org.gradle.java.installations.paths=.toolchains/zulu25/zulu25.36.205-ca-jdk25.0.4.1-win_x64

# Fabric / Minecraft
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.164.0+26.3
carpet_version=26.3
loom_version=1.17.21
sqlite_jdbc_version=3.53.4.0

# Mod
mod_version=0.2.0
maven_group=dev.themisstats
archives_base_name=themis-stats
