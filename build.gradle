plugins {
    // Minecraft 26.1 起游戏不再混淆，Fabric 换成了**不重映射**的新版 Loom。
    // 旧的 fabric-loom（1.13.x，带 remapJar）不能用于 26.3。
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

loom {
    // Carpet 26.3 ships an access widener; Loom applies dependency access wideners
    // automatically, but Themis Stats needs its own for the Minecraft members it touches.
    accessWidenerPath = file('src/main/resources/themisstats.accesswidener')
    runtimeOnlyLog4j = true

    runs {
        server {
            server()
            runDir = 'run/server'
        }
    }
}

dependencies {
    // 26.3 的游戏本体不再需要 mappings 依赖。
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 新版 Loom 下 modImplementation 换成普通的 implementation。
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Carpet is a hard runtime dependency. Compiled against the published 26.3 artifact.
    implementation "maven.modrinth:carpet:${project.carpet_version}"

    // Embedded SQLite driver, shaded into the release jar.
    implementation "org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}"
    include "org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "carpet_version", project.carpet_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "carpet_version": project.carpet_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    // Minecraft 26.1 起要求 Java 25。
    it.options.release = 25
}

java {
    withSourcesJar()
    // Java 25 toolchain：编译、测试都用同一套 JDK。
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
